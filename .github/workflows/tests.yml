name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'rclone.zip'
          Invoke-WebRequest 'https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-windows-amd64.zip' -OutFile $Archive
          Expand-Archive -LiteralPath $Archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'rclone')
          (Join-Path $env:RUNNER_TEMP 'rclone/rclone-v1.71.0-windows-amd64') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Test and analyze
        shell: pwsh
        run: ./tests/run-tests.ps1 -Analyze
